<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journée des Champions du Tir Sportif — 26 septembre 2026</title>
<style>
  :root {
    --bleu-ligue: #0846AD;
    --bleu-clair: #1c5fd6;
    --rouge-accent: #DE2022;
    --or-accent: #FDCA00;
    --gris-fond: #f4f5f7;
    --gris-texte: #3a3f47;
    --blanc: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--gris-fond);
    color: var(--gris-texte);
    line-height: 1.5;
  }

  /* --- Cibles en filigrane (motif signature) --- */
  .cible-motif {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.12);
  }

  header {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bleu-ligue) 0%, var(--bleu-clair) 100%);
    color: var(--blanc);
    padding: 40px 24px 36px;
    text-align: center;
  }

  header::before {
    content: "";
    position: absolute;
    top: -60px;
    right: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.10);
  }
  header::after {
    content: "";
    position: absolute;
    top: -20px;
    right: -20px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px solid var(--or-accent);
    opacity: 0.35;
  }

  .logo-zone {
    width: 92px;
    height: 92px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--blanc);
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .logo-zone img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 12px;
    font-weight: 600;
    color: var(--or-accent);
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 700;
    position: relative;
    z-index: 1;
  }

  .infos-event {
    position: relative;
    z-index: 1;
    display: inline-flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    justify-content: center;
    font-size: 14.5px;
    margin-top: 6px;
  }
  .infos-event span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    opacity: 0.95;
  }
  .infos-event strong { font-weight: 700; }

  main {
    max-width: 640px;
    margin: -28px auto 60px;
    padding: 0 20px;
  }

  .carte {
    background: var(--blanc);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(13,44,84,0.10);
    padding: 32px 28px 28px;
    position: relative;
    z-index: 2;
  }

  .carte h2 {
    font-size: 17px;
    color: var(--bleu-ligue);
    margin: 0 0 4px;
    border-left: 4px solid var(--rouge-accent);
    padding-left: 10px;
  }
  .carte .sous-titre {
    font-size: 13.5px;
    color: #6b7280;
    margin: 0 0 20px 14px;
  }

  .champ {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--bleu-ligue);
  }
  input[type="text"] {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid #d7dbe2;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--bleu-clair);
    box-shadow: 0 0 0 3px rgba(28,77,133,0.12);
  }

  .choix-groupe {
    display: flex;
    gap: 10px;
  }
  .choix-btn {
    flex: 1;
    position: relative;
  }
  .choix-btn input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .choix-btn .etiquette {
    display: block;
    text-align: center;
    padding: 10px 8px;
    border: 1.5px solid #d7dbe2;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--gris-texte);
    transition: all 0.15s;
    cursor: pointer;
  }
  .choix-btn input:checked + .etiquette {
    background: var(--bleu-ligue);
    border-color: var(--bleu-ligue);
    color: var(--blanc);
  }
  .choix-btn input:focus-visible + .etiquette {
    outline: 2px solid var(--rouge-accent);
    outline-offset: 2px;
  }

  fieldset {
    border: 1.5px solid #e5e8ee;
    border-radius: 10px;
    padding: 18px 16px 16px;
    margin: 24px 0 20px;
  }
  legend {
    font-weight: 700;
    color: var(--bleu-ligue);
    font-size: 14px;
    padding: 0 6px;
  }

  #bloc-accompagnant {
    display: none;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed #d7dbe2;
  }
  #bloc-accompagnant.visible { display: block; }

  button[type="submit"] {
    width: 100%;
    padding: 15px;
    background: var(--rouge-accent);
    color: var(--blanc);
    border: none;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    margin-top: 6px;
  }
  button[type="submit"]:hover { background: #a30d25; }
  button[type="submit"]:active { transform: scale(0.99); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }

  .obligatoire { color: var(--rouge-accent); }

  #message-etat {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 600;
    text-align: center;
  }
  #message-etat.succes {
    display: block;
    background: #e7f6ec;
    color: #1c6b39;
    border: 1px solid #b8e2c4;
  }
  #message-etat.erreur {
    display: block;
    background: #fdecec;
    color: #a3242f;
    border: 1px solid #f3bcc0;
  }

  footer {
    text-align: center;
    font-size: 12.5px;
    color: #9aa0aa;
    padding: 0 20px 30px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

    <p class="sous-titre">Merci de répondre avant le début de la manifestation.</p>

    <form id="formulaire-invitation">

      <div class="champ">
        <label for="nom">Nom <span class="obligatoire">*</span></label>
        <input type="text" id="nom" name="nom" required autocomplete="family-name">
      </div>

      <div class="champ">
        <label for="prenom">Prénom <span class="obligatoire">*</span></label>
        <input type="text" id="prenom" name="prenom" required autocomplete="given-name">
      </div>

      <fieldset>
        <legend>Votre présence</legend>

        <div class="champ">
          <label>À la cérémonie <span class="obligatoire">*</span></label>
          <div class="choix-groupe">
            <div class="choix-btn">
              <input type="radio" name="presentCeremonie" id="presCerOui" value="Oui" required>
              <label for="presCerOui" class="etiquette">Oui</label>
            </div>
            <div class="choix-btn">
              <input type="radio" name="presentCeremonie" id="presCerNon" value="Non">
              <label for="presCerNon" class="etiquette">Non</label>
            </div>
          </div>
        </div>

        <div class="champ" style="margin-bottom:0;">
          <label>À l'apéritif dînatoire <span class="obligatoire">*</span></label>
          <div class="choix-groupe">
            <div class="choix-btn">
              <input type="radio" name="presentAperitif" id="presApOui" value="Oui" required>
              <label for="presApOui" class="etiquette">Oui</label>
            </div>
            <div class="choix-btn">
              <input type="radio" name="presentAperitif" id="presApNon" value="Non">
              <label for="presApNon" class="etiquette">Non</label>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Accompagnant (1 maximum)</legend>

        <div class="champ" style="margin-bottom:0;">
          <label>Serez-vous accompagné(e) ?</label>
          <div class="choix-groupe">
            <div class="choix-btn">
              <input type="radio" name="aAccompagnant" id="accOui" value="Oui">
              <label for="accOui" class="etiquette">Oui</label>
            </div>
            <div class="choix-btn">
              <input type="radio" name="aAccompagnant" id="accNon" value="Non" checked>
              <label for="accNon" class="etiquette">Non</label>
            </div>
          </div>
        </div>

        <div id="bloc-accompagnant">
          <div class="champ">
            <label for="nomAccompagnant">Nom et prénom de l'accompagnant</label>
            <input type="text" id="nomAccompagnant" name="nomAccompagnant">
          </div>

          <div class="champ">
            <label>Accompagnant présent à la cérémonie</label>
            <div class="choix-groupe">
              <div class="choix-btn">
                <input type="radio" name="accCeremonie" id="accCerOui" value="Oui">
                <label for="accCerOui" class="etiquette">Oui</label>
              </div>
              <div class="choix-btn">
                <input type="radio" name="accCeremonie" id="accCerNon" value="Non">
                <label for="accCerNon" class="etiquette">Non</label>
              </div>
            </div>
          </div>

          <div class="champ" style="margin-bottom:0;">
            <label>Accompagnant présent à l'apéritif dînatoire</label>
            <div class="choix-groupe">
              <div class="choix-btn">
                <input type="radio" name="accAperitif" id="accApOui" value="Oui">
                <label for="accApOui" class="etiquette">Oui</label>
              </div>
              <div class="choix-btn">
                <input type="radio" name="accAperitif" id="accApNon" value="Non">
                <label for="accApNon" class="etiquette">Non</label>
              </div>
            </div>
          </div>
        </div>
      </fieldset>

      <button type="submit" id="bouton-envoyer">Envoyer ma réponse</button>

      <div id="message-etat"></div>

    </form>
  </div>
</main>

<footer>
  Ligue de Tir — Journée des Champions du Tir Sportif · 26 septembre 2026 · Vendargues
</footer>

<script>
  // ============================================================
  // URL DU WEB APP GOOGLE APPS SCRIPT — À REMPLACER
  // Voir le fichier d'instructions fourni pour l'obtenir.
  // ============================================================
  const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbxPUUfbAcYULRvTEthHME-lKdb18tQLfC11gg1emNWQJNM75ZHQ2uKOWCtI1JKyVDf0/exec";

  const form = document.getElementById('formulaire-invitation');
  const blocAccompagnant = document.getElementById('bloc-accompagnant');
  const radiosAccompagnant = document.querySelectorAll('input[name="aAccompagnant"]');
  const bouton = document.getElementById('bouton-envoyer');
  const messageEtat = document.getElementById('message-etat');

  function toggleBlocAccompagnant() {
    const oui = document.getElementById('accOui').checked;
    blocAccompagnant.classList.toggle('visible', oui);
    // Rend les champs accompagnant non-obligatoires par défaut ;
    // s'il y a un accompagnant, on exige au moins son nom.
    document.getElementById('nomAccompagnant').required = oui;
  }
  radiosAccompagnant.forEach(r => r.addEventListener('change', toggleBlocAccompagnant));
  toggleBlocAccompagnant();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    messageEtat.className = '';
    messageEtat.textContent = '';

    if (URL_GOOGLE_SHEETS === "COLLER_ICI_URL_DU_WEB_APP"  {
      messageEtat.className = 'erreur';
      messageEtat.textContent =
        "Le formulaire n'est pas encore relié au Google Sheets (URL manquante). " +
        "Voir le fichier d'instructions.";
      return;
    }

    const donnees = new FormData(form);
    bouton.disabled = true;
    bouton.textContent = "Envoi en cours…";

    fetch(URL_GOOGLE_SHEETS, {
      method: 'POST',
      mode: 'no-cors',
      body: donnees
    })
    .then(function () {
      messageEtat.className = 'succes';
      messageEtat.textContent = "✓ Merci ! Votre réponse a bien été enregistrée.";
      form.reset();
      toggleBlocAccompagnant();
      bouton.disabled = false;
      bouton.textContent = "Envoyer ma réponse";
    })
    .catch(function () {
      messageEtat.className = 'erreur';
      messageEtat.textContent =
        "Une erreur est survenue lors de l'envoi. Merci de réessayer.";
      bouton.disabled = false;
      bouton.textContent = "Envoyer ma réponse";
    });
  });
</script>

</body>
</html>
